<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Water</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030507;
            --panel: rgba(6, 12, 16, 0.78);
            --line: rgba(110, 220, 255, 0.28);
            --accent: #6edcff;
            --ok: #62f08a;
            --warn: #ffc94a;
            --danger: #ff4a3d;
            --text: #d6e6ee;
            --muted: #7d95a3;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }
        canvas#view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
        canvas#view.drag { cursor: grabbing; }
        canvas#labels { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
        .panel {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 8px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }
        #hud { top: 12px; left: 12px; min-width: 340px; max-width: calc(100vw - 24px); white-space: pre; overflow: hidden; }
        #hud .t { color: var(--accent); letter-spacing: 0.12em; }
        #hud .on { color: var(--ok); }
        #hud .off { color: var(--danger); }
        #hud .w { color: var(--warn); }
        #hud .m { color: var(--muted); }
        #help { bottom: 12px; left: 12px; white-space: pre; color: var(--muted); }
        #help b { color: var(--text); font-weight: normal; }
        #tools { bottom: 12px; right: 12px; white-space: pre; color: var(--muted); }
        #tools b { color: var(--accent); font-weight: normal; }
        #tools .sel { color: var(--warn); }
        #toast { top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--warn); font-size: 16px; display: none; text-align: center; }
        #fallback { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; background: var(--bg); padding: 16px; }
        #fallback.show { display: flex; }
        .card { max-width: 480px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--danger); padding: 14px 16px; }
        .tag { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--danger); }
        h1 { margin: 4px 0 2px; font-size: 24px; letter-spacing: 0.04em; text-transform: uppercase; }
        .desc { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
        #fallback pre { white-space: pre-wrap; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--danger); background: rgba(0,0,0,0.4); padding: 10px; margin: 10px 0 0; max-height: 40vh; overflow: auto; }
        @media (max-width: 700px) { #help, #tools { display: none; } #hud { font-size: 10px; min-width: 0; } }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <canvas id="labels"></canvas>
    <div id="hud" class="panel"></div>
    <div id="help" class="panel"></div>
    <div id="tools" class="panel"></div>
    <div id="toast" class="panel"></div>
    <div id="fallback">
        <div class="card">
            <div class="tag">SYSTEM FAULT</div>
            <h1>WebGPU unavailable</h1>
            <p class="desc">This demo needs WebGPU (Chrome/Edge 113+, or Brave with WebGPU enabled in brave://flags).</p>
            <pre id="error-message">navigator.gpu is undefined</pre>
        </div>
    </div>

<!--
  Scenario: the whole world as data. Positions are metres, [x, z] on the map (x east, z south, map centred on 0).
    terrain   size (m), resolution (cells per side = flow sim grid), base height
    sim       flow solver: stepsPerFrame, stepTime (s per step), gravity, diffusion, linDamping, sqrDamping, cfl, turbulenceSpeed,
              absorption, evaporation (mm/h), friction{Min,Max}Depth, frictionAmount, minDepth, wetDecay, warmup, edges (open | closed)
    waves     surface wave cascades around the camera: speed (m/s), damping, noise, foam, layers [{ size, resolution, height }]
    water     look: deep [rgb], absorb [rgb per m], refraction, foam, detail, flowScale
    entities  { type, id, label, ... }, type in ENTITY_TYPES, applied in order:
              terrain  tilt { dir, drop } | hills { amplitude, scale, octaves, seed, ridged } | mountain { pos, radius, height, roughness }
                       valley { path, width, channel, bank, levels [from, to], wiggle } | basin { pos, radius, floor } | coast { dir, at, width, floor }
                       dam { from, to, crest, top, side, spillway { width, depth }, gap { at, width }, breachTime }
              water    sea { level } | lake { pos, level } | spring { pos, rate m3/s, radius } | rain { rate mm/h, pos?, radius?, enabled }
                       drain { pos, rate m3/s, radius } | debris { pos, radius, count, size, color, life }
    tools     { type (pour drain raise dig splash), key, ... } applied with the right mouse button
    lighting  named presets: sun { azimuth, elevation, color, intensity }, sky { top, horizon }, ground, ambient, fog, exposure
    views     { name, pos [x, y, z], look [x, y, z] }
-->

<script>
'use strict';
// =====================================================================================================
// Entity Water: a GPU shallow-water river simulation over a heightmap, after Filip Strugar's RiverSim
// (github.com/fstrugar/riversim), rebuilt as one static WebGPU page.
//
//   1. Flow sim (per step, compute): virtual-pipe style diffusion + acceleration along the water surface
//      gradient (8 neighbours), RiverSim's velocity regulation (linear / quadratic / depth-based friction),
//      water sources, then mass-conserving forward advection of depth and momentum by the velocity field.
//   2. Surface waves (per frame, compute): finite-difference wave maps in cascades that follow the camera,
//      advected by the flow velocity, excited by flow turbulence, plus an advected foam map.
//   3. Render: terrain (soft heightfield shadows, wet banks, caustics), then water with screen-space
//      refraction, depth absorption, sky reflection, flow-mapped detail normals and foam.
//
// The world is data (the scenario JSON above). Every entity is a class in ENTITY_TYPES: terrain features
// stamp the heightmap, water entities fill lakes, add sources / sinks, or emit floating debris.
// =====================================================================================================

// ------------------------------------------------------------------------------------------------ config
const DEG = Math.PI / 180;
const NEAR = 0.5;
const MAX_SOURCES = 128;
const MAX_LAYERS = 4;
const MAX_PARTICLES = 16384;
const SOURCE_FLOATS = 8;
const FRAME_FLOATS = 112;
const RENDER_MODES = ['shaded', 'depth', 'velocity', 'foam / turbulence', 'wave cascades'];
const SIM_DEFAULTS = {
    stepsPerFrame: 32, stepTime: 0.12, gravity: 9.81, acceleration: null, diffusion: 0.06, linDamping: 0.99, sqrDamping: 0.05,
    absorption: 1, evaporation: 0, frictionMinDepth: 0, frictionMaxDepth: 1, frictionAmount: 0.9,
    minDepth: 0.03, wetDecay: 0.9998, warmup: 12000, edges: 'open', cfl: 0.3, turbulenceSpeed: 8,
};
const WAVE_DEFAULTS = { speed: 5, damping: 0.985, noise: 1, foam: 1, layers: [] };
const WATER_DEFAULTS = { deep: [0.03, 0.085, 0.08], absorb: [0.38, 0.13, 0.11], refraction: 0.035, foam: 1, detail: 1, flowScale: 3 };

// -------------------------------------------------------------------------------------------------- math
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const v3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]),
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};

// column-major 4x4
const m4 = {
    mul(a, b) {
        const o = new Float32Array(16);
        for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
            let s = 0;
            for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
            o[c * 4 + r] = s;
        }
        return o;
    },
    // rows: right, up, back
    view(eye, r, u, f) {
        const b = [-f[0], -f[1], -f[2]];
        return new Float32Array([r[0], u[0], b[0], 0, r[1], u[1], b[1], 0, r[2], u[2], b[2], 0,
            -v3.dot(r, eye), -v3.dot(u, eye), -v3.dot(b, eye), 1]);
    },
    // reversed-Z, infinite far plane: depth = near / view distance
    reversedInfinite(fovy, aspect, near) {
        const f = 1 / Math.tan(fovy / 2);
        return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, 0, -1, 0, 0, near, 0]);
    },
    project(m, p) {
        return [0, 1, 2, 3].map(r => m[r] * p[0] + m[4 + r] * p[1] + m[8 + r] * p[2] + m[12 + r]);
    },
};

function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// -------------------------------------------------------------------------------------------------- noise
function hash2(ix, iy, seed) {
    let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
}

function vnoise(x, y, seed) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed), c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy) * 2 - 1;
}

// fractal noise in about [-1, 1]; ridged gives sharp crests in [0, 1]
function fbm(x, y, { octaves = 5, seed = 1, ridged = false, gain = 0.5 } = {}) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let o = 0; o < octaves; o++) {
        const n = vnoise(x * f + o * 17.3, y * f - o * 9.1, seed + o * 31);
        sum += (ridged ? 1 - Math.abs(n) : n) * amp;
        norm += amp;
        amp *= gain;
        f *= 2.03;
    }
    return sum / norm;
}

// nearest point on a polyline: { dist, s (arc length at that point), total }
function polylineNearest(pts, lens, x, z) {
    let best = Infinity, bs = 0;
    for (let k = 0; k < pts.length - 1; k++) {
        const [ax, az] = pts[k], [bx, bz] = pts[k + 1], dx = bx - ax, dz = bz - az;
        const l2 = dx * dx + dz * dz || 1;
        const t = clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1);
        const px = ax + dx * t - x, pz = az + dz * t - z, d = px * px + pz * pz;
        if (d < best) { best = d; bs = lens[k] + t * Math.sqrt(l2); }
    }
    return { dist: Math.sqrt(best), s: bs };
}

function polylineLengths(pts) {
    const lens = [0];
    for (let k = 1; k < pts.length; k++) lens.push(lens[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    return lens;
}

// ----------------------------------------------------------------------------------------- heightfield
// CPU copy of the terrain: authored by entities, edited by tools, uploaded to the GPU by dirty rectangle.
// Cell (i, j) centre sits at (origin + (i + 0.5) * cell, origin + (j + 0.5) * cell); i runs along x, j along z.
class Heightfield {
    constructor(size, n, base) {
        this.size = size;
        this.n = n;
        this.cell = size / n;
        this.origin = -size / 2;
        this.h = new Float32Array(n * n).fill(base);
        this.dirty = null;
        this.min = base;
        this.max = base;
    }

    cx(i) { return this.origin + (i + 0.5) * this.cell; }
    ci(x) { return (x - this.origin) / this.cell - 0.5; }

    // calls fn(idx, x, z, i, j) for every cell centre inside the world-space box
    each(x0, z0, x1, z1, fn) {
        const n = this.n;
        const i0 = clamp(Math.floor(this.ci(x0)), 0, n - 1), i1 = clamp(Math.ceil(this.ci(x1)), 0, n - 1);
        const j0 = clamp(Math.floor(this.ci(z0)), 0, n - 1), j1 = clamp(Math.ceil(this.ci(z1)), 0, n - 1);
        for (let j = j0; j <= j1; j++) {
            const z = this.cx(j);
            for (let i = i0; i <= i1; i++) fn(j * n + i, this.cx(i), z, i, j);
        }
        return { i0, j0, i1, j1 };
    }

    eachAll(fn) { return this.each(-Infinity, -Infinity, Infinity, Infinity, fn); }

    sample(x, z) {
        const n = this.n, fx = clamp(this.ci(x), 0, n - 1), fz = clamp(this.ci(z), 0, n - 1);
        const i = Math.min(Math.floor(fx), n - 2), j = Math.min(Math.floor(fz), n - 2), tx = fx - i, tz = fz - j, h = this.h;
        const a = h[j * n + i], b = h[j * n + i + 1], c = h[(j + 1) * n + i], d = h[(j + 1) * n + i + 1];
        return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
    }

    touch(r) {
        const d = this.dirty;
        this.dirty = d ? { i0: Math.min(d.i0, r.i0), j0: Math.min(d.j0, r.j0), i1: Math.max(d.i1, r.i1), j1: Math.max(d.j1, r.j1) } : { ...r };
    }

    updateRange() {
        let lo = Infinity, hi = -Infinity;
        for (const v of this.h) { if (v < lo) lo = v; if (v > hi) hi = v; }
        this.min = lo;
        this.max = hi;
    }

    // smooth bump (amount > 0) or dent (amount < 0) of radius r
    brush(x, z, r, amount) {
        const rect = this.each(x - r, z - r, x + r, z + r, (idx, cx, cz) => {
            const d = Math.hypot(cx - x, cz - z) / r;
            if (d < 1) this.h[idx] += amount * (1 - d * d) * (1 - d * d);
        });
        this.touch(rect);
        this.max = Math.max(this.max, this.h.reduce((m, v) => v > m ? v : m, -Infinity));
    }

    // first hit of a ray with the heightfield, or null
    raycast(o, d, maxDist = 9000) {
        let t = 0, prev = 0;
        const above = t => { const p = v3.add(o, v3.mul(d, t)); return p[1] - this.sample(p[0], p[2]); };
        if (above(0) < 0) return null;
        while (t < maxDist) {
            const step = Math.max(this.cell * 0.5, t * 0.004);
            prev = t;
            t += step;
            const p = v3.add(o, v3.mul(d, t));
            if (Math.abs(p[0]) > this.size * 0.75 || Math.abs(p[2]) > this.size * 0.75) { if (p[1] < this.min) return null; continue; }
            if (above(t) < 0) {
                let a = prev, b = t;
                for (let k = 0; k < 20; k++) { const m = (a + b) / 2; if (above(m) < 0) b = m; else a = m; }
                return v3.add(o, v3.mul(d, b));
            }
        }
        return null;
    }
}

// 4-connected flood fill of every cell below `level` reachable from the seeds; sets depth to the level
function floodFill(field, water, seeds, level) {
    const n = field.n, h = field.h, seen = new Uint8Array(n * n), stack = [];
    for (const s of seeds) if (h[s] < level && !seen[s]) { seen[s] = 1; stack.push(s); }
    let count = 0;
    while (stack.length) {
        const idx = stack.pop(), i = idx % n, j = (idx - i) / n;
        water[idx] = Math.max(water[idx], level - h[idx]);
        count++;
        const nb = [i > 0 ? idx - 1 : -1, i < n - 1 ? idx + 1 : -1, j > 0 ? idx - n : -1, j < n - 1 ? idx + n : -1];
        for (const q of nb) if (q >= 0 && !seen[q] && h[q] < level) { seen[q] = 1; stack.push(q); }
    }
    return count;
}

// ------------------------------------------------------------------------------------------ WGSL flow sim
// State texture (rgba32float): depth (m), velocity (cells per step, x and z), wet (recently wet, 0..1).
const WGSL_FLOW = /* wgsl */`
struct Sim {
    n: i32, sourceCount: u32, edgeMode: u32, frame: u32,
    cell: f32, stepTime: f32, diffusion: f32, acceleration: f32,
    linDamp: f32, sqrDamp: f32, absorption: f32, rain: f32,
    fricMin: f32, fricMax: f32, fricAmount: f32, seaLevel: f32,
    minDepth: f32, wetDecay: f32, evaporation: f32, velScale: f32,
    cfl: f32, turbulenceSpeed: f32, _p2: f32, _p3: f32,
}
struct Source { a: vec4f, b: vec4f }     // a: centre (cells), radius (cells), depth per step at the centre (< 0: sink); b.x: flat profile

@group(0) @binding(0) var<uniform> S: Sim;
@group(0) @binding(1) var terrainTex: texture_2d<f32>;
@group(0) @binding(2) var stateIn: texture_2d<f32>;
@group(0) @binding(3) var stateOut: texture_storage_2d<rgba32float, write>;
@group(0) @binding(4) var<storage, read> sources: array<Source>;
@group(0) @binding(5) var surfOut: texture_storage_2d<rg32float, write>;
@group(0) @binding(6) var flowOut: texture_storage_2d<rgba16float, write>;
@group(0) @binding(7) var<storage, read_write> stats: array<atomic<u32>, 4>;

var<private> OFFS: array<vec2i, 8> = array<vec2i, 8>(
    vec2i(-1, 0), vec2i(1, 0), vec2i(0, -1), vec2i(0, 1),
    vec2i(-1, -1), vec2i(1, 1), vec2i(1, -1), vec2i(-1, 1));

fn inside(p: vec2i) -> bool { return p.x >= 0 && p.y >= 0 && p.x < S.n && p.y < S.n; }
fn H(p: vec2i) -> f32 { return textureLoad(terrainTex, p, 0).x; }
fn ST(p: vec2i) -> vec4f { return textureLoad(stateIn, p, 0); }

// RiverSim: cap at 0.499 cells per step, linear and quadratic damping, more friction in shallow water
fn regulate(v: vec2f, depth: f32, min9: f32) -> vec2f {
    let l = length(v) + 1e-5;
    var ln = min(l, 0.499);
    let range = max(S.fricMax - S.fricMin, 1e-4);
    let kc = clamp((depth - S.fricMin) / range, 0.0, 1.0);
    let k9 = clamp((min9 - S.fricMin) / range, 0.0, 1.0);
    ln *= S.linDamp * mix(S.fricAmount * S.fricAmount, 1.0, kc) * mix(S.fricAmount, 1.0, k9);
    let ld = ln * S.sqrDamp;
    ln -= ld * ld;
    return v * (max(ln, 0.0) / l);
}

// step 1: exchange water with the 8 neighbours along the surface gradient, accelerate, add sources
@compute @workgroup_size(8, 8)
fn simulate(@builtin(global_invocation_id) gid: vec3u) {
    let p = vec2i(gid.xy);
    if (!inside(p)) { return; }
    let c = ST(p);
    let hc = H(p);
    let sc = hc + c.x;
    var dsum = 0.0;
    var vadd = vec2f(0.0);
    var min9 = c.x;
    var max9 = c.x;
    for (var k = 0; k < 8; k++) {
        let o = OFFS[k];
        let q = p + o;
        if (!inside(q)) { continue; }
        let s = ST(q);
        min9 = min(min9, s.x);
        max9 = max(max9, s.x);
        // antisymmetric between the pair, so the exchange conserves mass
        let d = clamp(H(q) + s.x - sc, -c.x, s.x);
        let diag = k >= 4;
        dsum += d * select(1.0, 0.70710678, diag);
        vadd -= vec2f(o) * (d * select(1.0, 0.35355339, diag));
    }
    var depth = c.x + S.diffusion * dsum;
    // gravity waves travel ~sqrt(acceleration * depth / cell) cells per step: cap that for deep water (lakes)
    let accel = min(S.acceleration, S.cfl * S.cell / max(max9, 1e-3));
    var vel = c.yz + vadd * (accel / S.cell);
    vel = regulate(vel, depth, min9);
    vel *= clamp((depth - 1e-6) * 1e7, 0.0, 1.0);

    let pc = vec2f(p);
    var add = S.rain;
    var sink = 0.0;
    for (var i = 0u; i < S.sourceCount; i++) {
        let src = sources[i];
        let r = length(pc - src.a.xy) / src.a.z;
        if (r >= 1.0) { continue; }
        let prof = select(sqrt(1.0 - r), 1.0, src.b.x > 0.5);
        if (src.a.w >= 0.0) { add += src.a.w * prof; } else { sink -= src.a.w * prof; }
    }
    depth = max(0.0, depth * S.absorption + add - sink - S.evaporation);

    let border = p.x == 0 || p.y == 0 || p.x == S.n - 1 || p.y == S.n - 1;
    if (border && S.edgeMode == 1u) { depth = 0.0; vel = vec2f(0.0); }
    if (border && S.edgeMode == 2u) { depth = max(0.0, S.seaLevel - hc); }
    textureStore(stateOut, p, vec4f(depth, vel, c.w));
}

// step 2: move depth and momentum by the velocity; every neighbour's water lands on a bilinear footprint
@compute @workgroup_size(8, 8)
fn propagate(@builtin(global_invocation_id) gid: vec3u) {
    let p = vec2i(gid.xy);
    if (!inside(p)) { return; }
    var depth = 0.0;
    var mom = vec2f(0.0);
    var avg = vec2f(0.0);
    for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
            let q = p + vec2i(dx, dy);
            if (!inside(q)) { continue; }
            let s = ST(q);
            let off = vec2f(f32(dx), f32(dy)) + s.yz;
            let nd = max(vec2f(1.0) - abs(off), vec2f(0.0));
            let cd = nd.x * nd.y * s.x;
            depth += cd;
            mom += s.yz * cd;
            avg += s.yz;
        }
    }
    var vel = mom / (depth + 1e-6);
    vel = (vel * 25.0 + avg) / 34.0;
    let c = ST(p);
    let wet = max(c.w * S.wetDecay, select(0.0, 1.0, depth > S.minDepth));
    textureStore(stateOut, p, vec4f(depth, vel, wet));
}

// once per frame: render inputs (surface extended one cell over dry banks, velocity in m/s, turbulence) and stats
var<workgroup> wgVol: atomic<u32>;
var<workgroup> wgWet: atomic<u32>;
var<workgroup> wgMax: atomic<u32>;

@compute @workgroup_size(8, 8)
fn info(@builtin(global_invocation_id) gid: vec3u, @builtin(local_invocation_index) li: u32) {
    let p = vec2i(gid.xy);
    if (inside(p)) {
        let s = ST(p);
        let h = H(p);
        let wetCell = s.x > S.minDepth;
        var surf = h + s.x;
        if (!wetCell) {
            var sum = 0.0;
            var cnt = 0.0;
            for (var k = 0; k < 8; k++) {
                let q = p + OFFS[k];
                if (!inside(q)) { continue; }
                let t = ST(q);
                if (t.x > S.minDepth) { sum += H(q) + t.x; cnt += 1.0; }
            }
            surf = select(-1e5, sum / max(cnt, 1.0), cnt > 0.0);
        }
        let speed = length(s.yz);
        let range = max(S.fricMax - S.fricMin, 1e-4);
        let pm = pow(mix(S.fricAmount, 1.0, clamp((s.x - S.fricMin) / range, 0.0, 1.0)), 4.0);
        let pert = clamp(speed * S.velScale / S.turbulenceSpeed / pm, 0.0, 1.0);
        let w = select(0.0, 1.0, wetCell);
        textureStore(surfOut, p, vec4f(surf, s.w, 0.0, 0.0));
        textureStore(flowOut, p, vec4f(s.x * w, s.yz * S.velScale * w, pert * w));
        atomicAdd(&wgVol, u32(s.x * S.cell * S.cell * 10.0));
        if (wetCell) {
            atomicAdd(&wgWet, 1u);
            atomicMax(&wgMax, bitcast<u32>(speed * S.velScale));
        }
    }
    workgroupBarrier();
    if (li == 0u) {
        atomicAdd(&stats[0], atomicLoad(&wgVol));
        atomicAdd(&stats[1], atomicLoad(&wgWet));
        atomicMax(&stats[2], atomicLoad(&wgMax));
    }
}
`;

// ------------------------------------------------------------------------------------------ WGSL waves
// One cascade layer: a res x res wave map (height, previous height, foam) centred on the camera.
const WGSL_WAVES = /* wgsl */`
struct Wave {
    origin: vec2f, texel: f32, res: i32,
    shift: vec2f, dt: f32, damping: f32,
    mapOrigin: vec2f, mapSize: f32, step: u32,
    noise: f32, foamGain: f32, minDepth: f32, heightScale: f32,
    splash: vec4f,
}
@group(0) @binding(0) var<uniform> W: Wave;
@group(0) @binding(1) var stateIn: texture_2d<f32>;
@group(0) @binding(2) var stateOut: texture_storage_2d<rgba32float, write>;
@group(0) @binding(3) var flowTex: texture_2d<f32>;
@group(0) @binding(4) var samp: sampler;
@group(0) @binding(5) var dispOut: texture_storage_2d<rgba16float, write>;

fn ld(p: vec2i) -> vec4f {
    if (p.x < 0 || p.y < 0 || p.x >= W.res || p.y >= W.res) { return vec4f(0.0); }
    return textureLoad(stateIn, p, 0);
}
fn smp(x: vec2f) -> vec4f {
    let q = x - 0.5;
    let i = vec2i(floor(q));
    let f = q - floor(q);
    return mix(mix(ld(i), ld(i + vec2i(1, 0)), f.x), mix(ld(i + vec2i(0, 1)), ld(i + vec2i(1, 1)), f.x), f.y);
}
fn hash(p: vec2u, s: u32) -> f32 {
    var h = p.x * 1664525u + p.y * 1013904223u + s * 2654435761u;
    h ^= h >> 16u; h *= 2246822519u; h ^= h >> 13u; h *= 3266489917u; h ^= h >> 16u;
    return f32(h) / 4294967295.0;
}

@compute @workgroup_size(8, 8)
fn waveStep(@builtin(global_invocation_id) gid: vec3u) {
    let p = vec2i(gid.xy);
    if (p.x >= W.res || p.y >= W.res) { return; }
    let world = W.origin + (vec2f(p) + 0.5) * W.texel;
    let fl = textureSampleLevel(flowTex, samp, (world - W.mapOrigin) / W.mapSize, 0.0);
    // semi-Lagrangian: fetch last step's state upstream (and from where this texel was before the layer moved)
    let src = vec2f(p) + 0.5 + W.shift - fl.yz * (W.dt / W.texel);
    let c = smp(src);
    let h1 = smp(src + vec2f(0.0, -1.0)).x;
    let h3 = smp(src + vec2f(-1.0, 0.0)).x;
    let h5 = smp(src + vec2f(1.0, 0.0)).x;
    let h7 = smp(src + vec2f(0.0, 1.0)).x;
    var k = (h1 + h3 + h5 + h7) * 0.5 - c.y;
    // sparse impulses, stronger where the flow is turbulent
    let r = hash(vec2u(p), W.step) * 2.0 - 1.0;
    let nz = r * (fl.w + 0.2) * 1.3;
    k += clamp(pow(abs(nz), 5.0) * 0.35 * sign(nz) * pow(W.damping, 16.0), -0.35, 0.35) * W.noise;
    k *= W.damping;
    let edge = smoothstep(W.minDepth, W.minDepth + 0.8, fl.x);
    k = clamp(k * edge, -1.0, 1.0);
    if (W.splash.z > 0.0) {
        let d = length(world - W.splash.xy);
        if (d < W.splash.z) { k = clamp(k - W.splash.w * (1.0 - d / W.splash.z) * edge, -1.0, 1.0); }
    }

    // foam: made by steep wave fronts and turbulence, carried by the flow, slowly dissolving
    let a = smp(src + vec2f(-3.0, -1.0)).x;
    let b = smp(src + vec2f(1.0, -3.0)).x;
    let cc = smp(src + vec2f(3.0, 1.0)).x;
    let dd = smp(src + vec2f(-1.0, 3.0)).x;
    let delta = abs(a - cc) + abs(b - dd);
    let fc = max(0.0, sin(delta * 50.0)) * step(0.2, delta);
    let n1 = hash(vec2u(p), W.step / 8u);
    let n2 = hash(vec2u(p) + 7u, W.step / 8u + 3u);
    let nf = clamp((pow(n1 * n2 - 0.2, 2.0) + 0.02) * 10.0, 0.0, 1.0);
    let fadd = (fc * 0.5 + clamp(fl.w - 0.6, 0.0, 1.0)) * 0.08 * W.foamGain * nf * edge;
    let foam = clamp((c.z + fadd) * 0.95 - 0.002, 0.0, 1.0);
    textureStore(stateOut, p, vec4f(k, c.x, foam, 0.0));
}

// sharper crests, as in RiverSim's combined height map
fn shapeH(h: f32) -> f32 { return h + pow(abs(h), 3.0) * 0.3; }

@compute @workgroup_size(8, 8)
fn waveDisplay(@builtin(global_invocation_id) gid: vec3u) {
    let p = vec2i(gid.xy);
    if (p.x >= W.res || p.y >= W.res) { return; }
    let c = ld(p);
    let hl = shapeH(ld(p - vec2i(1, 0)).x);
    let hr = shapeH(ld(p + vec2i(1, 0)).x);
    let hu = shapeH(ld(p - vec2i(0, 1)).x);
    let hd = shapeH(ld(p + vec2i(0, 1)).x);
    let g = vec2f(hr - hl, hd - hu) * (W.heightScale / (2.0 * W.texel));
    textureStore(dispOut, p, vec4f(shapeH(c.x) * W.heightScale, g, c.z));
}
`;

// ------------------------------------------------------------------------------------------ WGSL debris
const WGSL_DEBRIS_SIM = /* wgsl */`
struct Deb { dt: f32, time: f32, count: u32, n: i32, mapOrigin: vec2f, cell: f32, minDepth: f32 }
struct Particle { p: vec4f, q: vec4f }     // p: position, age; q: heading, dry time, emitter, seed
struct Emitter { a: vec4f, b: vec4f }      // a: x, z, radius, life; b: colour, size
@group(0) @binding(0) var<uniform> U: Deb;
@group(0) @binding(1) var<storage, read_write> parts: array<Particle>;
@group(0) @binding(2) var<storage, read> emitters: array<Emitter>;
@group(0) @binding(3) var flowTex: texture_2d<f32>;
@group(0) @binding(4) var samp: sampler;
@group(0) @binding(5) var surfTex: texture_2d<f32>;
@group(0) @binding(6) var terrainTex: texture_2d<f32>;

fn rnd(s: ptr<function, u32>) -> f32 {
    *s = *s * 747796405u + 2891336453u;
    var w = ((*s >> ((*s >> 28u) + 4u)) ^ *s) * 277803737u;
    w = (w >> 22u) ^ w;
    return f32(w) / 4294967295.0;
}
fn cellLoad(t: texture_2d<f32>, p: vec2i) -> vec2f { return textureLoad(t, clamp(p, vec2i(0), vec2i(U.n - 1)), 0).xy; }
fn height(xz: vec2f) -> f32 {
    let c = (xz - U.mapOrigin) / U.cell - 0.5;
    let i = vec2i(floor(c));
    let f = c - floor(c);
    var s = array<f32, 4>();
    for (var k = 0; k < 4; k++) {
        let q = i + vec2i(k & 1, k >> 1);
        let sv = cellLoad(surfTex, q).x;
        s[k] = select(sv, cellLoad(terrainTex, q).x, sv < -1e4);
    }
    return mix(mix(s[0], s[1], f.x), mix(s[2], s[3], f.x), f.y);
}

@compute @workgroup_size(64)
fn updateDebris(@builtin(global_invocation_id) gid: vec3u) {
    let i = gid.x;
    if (i >= U.count) { return; }
    var pt = parts[i];
    let e = emitters[u32(pt.q.z)];
    let size = U.cell * f32(U.n);
    let fl = textureSampleLevel(flowTex, samp, (pt.p.xz - U.mapOrigin) / size, 0.0);
    if (fl.x > max(U.minDepth * 2.0, e.b.w * 0.1)) {
        pt.p.x += fl.y * U.dt;
        pt.p.z += fl.z * U.dt;
        let sp = length(fl.yz);
        if (sp > 0.05) {
            let heading = atan2(fl.z, fl.y);
            var dh = heading - pt.q.x;
            dh = dh - 6.2831853 * round(dh / 6.2831853);
            pt.q.x += dh * min(1.0, U.dt * 0.6);
        }
        pt.q.x += sin(U.time * 0.7 + pt.q.w * 40.0) * U.dt * 0.15;
        // a little random walk; logs caught in still water count as stranded after a while
        let j = vec2f(sin(U.time * 1.3 + pt.q.w * 91.0), cos(U.time * 1.1 + pt.q.w * 57.0));
        pt.p.x += j.x * U.dt * 0.4;
        pt.p.z += j.y * U.dt * 0.4;
        pt.q.y = select(0.0, pt.q.y + U.dt * 0.1, sp < 0.2);
    } else {
        pt.q.y += U.dt;
    }
    pt.p.w += U.dt;
    let rel = (pt.p.xz - U.mapOrigin) / size;
    let out = any(rel < vec2f(0.005)) || any(rel > vec2f(0.995));
    if (pt.p.w > e.a.w || pt.q.y > 4.0 || out) {
        // respawn at the deepest of a few random spots around the emitter
        var s = i * 9781u + u32(U.time * 1000.0) * 6271u + 1u;
        var best = vec3f(e.a.xy, -1.0);
        for (var k = 0; k < 6; k++) {
            let a = rnd(&s) * 6.2831853;
            let r = sqrt(rnd(&s)) * e.a.z;
            let c = e.a.xy + vec2f(cos(a), sin(a)) * r;
            let d = textureSampleLevel(flowTex, samp, (c - U.mapOrigin) / size, 0.0).x;
            if (d > best.z) { best = vec3f(c, d); }
        }
        pt.p = vec4f(best.x, 0.0, best.y, 0.0);
        pt.q = vec4f(rnd(&s) * 6.2831853, 0.0, pt.q.z, rnd(&s));
    }
    pt.p.y = height(pt.p.xz) + e.b.w * 0.08 + sin(U.time * 1.7 + pt.q.w * 30.0) * 0.05;
    parts[i] = pt;
}
`;

fn hash21(p: vec2f) -> f32 {
    var q = fract(p * vec2f(123.34, 456.21));
    q += dot(q, q + 45.32);
    return fract(q.x * q.y);
